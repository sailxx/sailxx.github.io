<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sailxx — проекты</title>
  <meta name="description" content="Проекты sailxx. FITTER — Telegram-бот для подсчёта калорий и БЖУ по фото еды.">
  <link rel="canonical" href="https://sailxx.github.io/">
  <link rel="icon" href="https://sailxx.github.io/FITTER-AI/icon-32.png" type="image/png">
  <style>
    :root{--paper:#f7f8f2;--ink:#171916;--muted:#687067;--green:#c9f36b;--line:#dfe3d8}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
    main{max-width:560px;width:100%}h1{font-size:28px;letter-spacing:-1px;margin:0 0 20px}
    a.card{display:flex;gap:16px;align-items:center;padding:20px;background:#fff;border:1px solid var(--line);border-radius:20px;text-decoration:none;color:inherit}
    a.card:hover{border-color:#9fbf5a}.card img{width:56px;height:56px;border-radius:14px}
    .card b{display:block;font-size:18px}.card span{color:var(--muted);font-size:14px;line-height:1.5}
  </style>
</head>
<body>
<main>
  <h1>Проекты</h1>
  <a class="card" href="https://sailxx.github.io/FITTER-AI/">
    <img src="https://sailxx.github.io/FITTER-AI/icon-120.png" alt="Логотип FITTER" width="56" height="56">
    <div><b>FITTER — подсчёт калорий по фото</b><span>Telegram-бот: сфотографируй еду, и ИИ посчитает калории и БЖУ и запишет в дневник</span></div>
  </a>
</main>
</body>
</html>
